name: traviato
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1

  # Social sign-in (#84)
  sign_in_with_apple: ^8.2.0
  google_sign_in: ^7.2.0
  crypto: ^3.0.6

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.2.3

  # Data Class & Functional Programming
  equatable: ^2.0.8
  fpdart: ^1.2.0

  # UI & Utilities
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  intl: ^0.20.2
  uuid: ^4.5.3
  string_validator: ^1.2.0
  stream_transform: ^2.1.1
  json_annotation: ^4.12.0
  google_fonts: ^6.2.1

  # Photo capture (#30)
  flutter_image_compress: ^2.4.0
  exif: ^3.3.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5

  # Monetization (#138) — RevenueCat's official Flutter SDK; wraps StoreKit/
  # Play Billing behind one API and syncs entitlement state via its webhook.
  purchases_flutter: ^10.13.1
  # Opens the platform-correct store subscription-management page (#142) —
  # the Flutter team's own package for launching an external URL/app.
  url_launcher: ^6.3.2
  # Voice dictation on the Journal note page (#206) — the most widely used
  # Flutter speech-recognition plugin; wraps Apple Speech (iOS) and the
  # system RecognitionService (Android) with partial results and mic level.
  speech_to_text: ^7.5.0
  # Renders the hand-drawn balloon doodles on the Journal note page's title
  # page (#205) from the design's exported SVGs.
  flutter_svg: ^2.3.0
  wakelock_plus: ^1.8.1
  # The Sky Story film's music (#345): just_audio is the most used Flutter
  # audio player (asset playback, seek, volume); audio_session sets the
  # "ambient" category so the silent switch mutes it and it mixes with
  # other audio.
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Drives the dictation timer in tests (#206); already shipped with
  # flutter_test, declared so it can be imported directly.
  fake_async: any
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  json_serializable: ^6.9.0
  # Faking UrlLauncherPlatform.instance in the manage-subscription test (#142).
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  # Literata (OFL, google/fonts; licence in assets/fonts/Literata-OFL.txt):
  # the serif for Russian, since Fraunces has no Cyrillic (#239). Bundled,
  # not fetched at runtime. Variable fonts — weight goes via FontVariation.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata[opsz,wght].ttf
        - asset: assets/fonts/Literata-Italic[opsz,wght].ttf
          style: italic
    # The Sky Story film's type (#345; OFL, google/fonts, licences next to
    # each file). DM Serif Display has no Cyrillic, so Russian titles use
    # Playfair Display. Open Sans, Caveat and Playfair are variable.
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay[wght].ttf
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans[wdth,wght].ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat[wght].ttf
    # The Golden Vows film's type (#346; OFL, google/fonts, licences next
    # to each file). Cormorant Garamond is variable and has Cyrillic; Pinyon
    # Script has none, so Russian script lines fall back to Great Vibes.
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond[wght].ttf
    - family: PinyonScript
      fonts:
        - asset: assets/fonts/PinyonScript-Regular.ttf
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
    # The Neon Night film's type (#363; OFL, google/fonts, licences next to
    # each file). Big Shoulders Display (variable) has no Cyrillic, so
    # Russian titles fall back to Fira Sans Extra Condensed, a close
    # condensed sans with Cyrillic (static 600/800/900). JetBrains Mono
    # (variable, Cyrillic) is bundled so the film never fetches a font.
    - family: BigShouldersDisplay
      fonts:
        - asset: assets/fonts/BigShouldersDisplay[wght].ttf
    - family: FiraSansExtraCondensed
      fonts:
        - asset: assets/fonts/FiraSansExtraCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraSansExtraCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/FiraSansExtraCondensed-Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf

  assets:
    - .env
    - assets/audio/
    - assets/images/brand/
    - assets/images/guest/
    - assets/images/covers/
    - assets/images/trip/
    - assets/images/journal/
    - assets/images/journal/balloons/
