name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env (bundled as an asset; git-ignored so absent in CI)
        run: cp .env.example .env

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  verify-edge-functions:
    name: Edge functions (lint, type-check, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint
        working-directory: supabase/functions/generate_wrap_up
        run: deno lint

      - name: Type-check
        working-directory: supabase/functions/generate_wrap_up
        run: deno check index.ts handler.ts gather.ts anthropic.ts screenplay.ts

      - name: Run tests
        working-directory: supabase/functions/generate_wrap_up
        run: deno test --allow-net

  deploy-functions:
    name: Deploy edge functions
    if: github.event_name == 'push'
    needs: verify-edge-functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy generate_wrap_up
        working-directory: supabase
        run: supabase functions deploy generate_wrap_up --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
